<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Piou : les visuels</title>
<meta name="robots" content="noindex">
<style>
  body { margin:0; background:#FDF7EF; color:#2E2B26;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    line-height:1.6; }
  main { max-width:640px; margin:0 auto; padding:32px 20px 64px; }
  h1 { font-size:1.5rem; margin-bottom:.2em; }
  h2 { font-size:1.1rem; margin:0 0 12px; }
  .bird { font-size:2.2rem; }
  .muted { color:#8a8378; font-size:.9rem; }
  .compte { color:#8a8378; font-size:.85rem; font-weight:500; }
  .post { background:#fff; border-radius:20px; padding:18px 20px; margin:22px 0;
    box-shadow:0 6px 24px rgba(154,123,63,.12); }
  .actions { display:flex; flex-wrap:wrap; gap:10px; margin:12px 0; }
  button { background:linear-gradient(90deg,#F1CC6B,#E3A85A); border:0;
    border-radius:999px; padding:11px 22px; font-size:.95rem; font-weight:800;
    color:#2E2B26; cursor:pointer; }
  button.zip { background:#F1E4CD; }
  button[disabled] { opacity:.55; cursor:default; }
  .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(90px,1fr));
    gap:8px; }
  .grid img { width:100%; aspect-ratio:9/16; object-fit:cover; border-radius:10px;
    background:#F1E4CD; display:block; }
  details { margin:12px 0; }
  summary { cursor:pointer; font-weight:700; font-size:.95rem; }
  .caption { white-space:pre-wrap; word-break:break-word; background:#F1E4CD;
    border-radius:12px; padding:12px; font-size:.9rem;
    font-family:inherit; margin:10px 0; }
  .etat { min-height:1.6em; font-size:.9rem; color:#8a8378; }
  .jours { list-style:none; padding:0; }
  .jours li { margin:8px 0; }
  .jours a { display:block; background:#fff; border-radius:16px; padding:14px 18px;
    color:#2E2B26; font-weight:700; text-decoration:none;
    box-shadow:0 6px 24px rgba(154,123,63,.12); }

</style>
</head>
<body>
<main>
  <div class="bird">🐤</div>
  <h1>Les visuels du jour</h1>
  <p class="muted">Une page par jour de publication, la plus récente en tête.</p>

</main>
</body>
</html>
